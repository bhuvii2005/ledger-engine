spring:
  application:
    name: ledger-engine

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      connection-init-sql: "SET lock_timeout = '2s'; SET statement_timeout = '5s'; SET idle_in_transaction_session_timeout = '10s'"

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # a dead or hung Redis costs a request at most this long before it falls back to Postgres
      timeout: 200ms
      connect-timeout: 200ms

  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
      status:
        # Redis only speeds up idempotency checks, so its DEGRADED status ranks below UP
        # and never turns the overall status DOWN. Postgres being down still does.
        order: DOWN,OUT_OF_SERVICE,UP,DEGRADED,UNKNOWN

ledger:
  max-transaction-amount-paise: 100000000
  system-account-number: SYS-CASH-0001
  posting:
    # attempts per request when a lock times out or Postgres picks us as a deadlock victim
    max-attempts: 3
    # backoff before retry n is base * 2^(n-1) plus up to 25ms of jitter
    retry-backoff-ms: 50
  idempotency:
    # must outlive one posting with all its retries: 3 x 2s lock_timeout + backoff < 10s
    in-progress-ttl: 10s
    completed-ttl: 24h
    # after a Redis error, skip Redis for this long so requests don't each wait out a timeout
    redis-skip-after-failure: 1s
    redis-warn-interval: 1m
  reconciliation:
    scheduled-enabled: true
    interval-ms: 300000

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%X{txnId}] %logger{36} - %msg%n"
